# 64 KB Supervision cart: banks 0-2 through the $8000 window, bank 3 fixed at $C000.
MEMORY {
    ZP: start = $0000, size = $0100, type = rw;
    B0: start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    B1: start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    B2: start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    B3: start = $C000, size = $4000, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    BANK0: load = B0, type = ro;
    BANK1: load = B1, type = ro;
    BANK2: load = B2, type = ro;
    BANK3: load = B3, type = ro;
    CODE: load = B3, type = ro;
    VECTORS: load = B3, type = ro, start = $FFFA;
}
